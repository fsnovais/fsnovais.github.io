name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# permissoes minimas para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# uma publicacao por vez, sem cancelar a que ja esta rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir tradução
        run: npm run check:i18n

      - name: Build
        env:
          PUBLIC_STATICFORMS_KEY: ${{ secrets.PUBLIC_STATICFORMS_KEY }}
        run: npm run build

      - name: Conferir links e âncoras
        run: npm run check:links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
